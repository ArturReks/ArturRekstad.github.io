<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Photo &amp; Design — Artur Rekstad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --k:#000; --w:#fff; }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--w);color:var(--k);font-family:'Inter',sans-serif;min-height:100vh;}
  .display{font-family:'Bebas Neue',sans-serif;text-transform:uppercase;line-height:.86;}
  .mono{font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:#999;}

  nav{position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:1.5rem 6vw;background:rgba(255,255,255,.88);backdrop-filter:blur(6px);}
  .nav-logo{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:.04em;color:var(--k);text-decoration:none;}
  nav ul{list-style:none;display:flex;gap:2rem;}
  nav ul li a{text-decoration:none;font-size:.78rem;color:#555;transition:color .15s;}
  nav ul li a:hover{color:var(--k);}
  @media(max-width:800px){ nav ul{display:none;} }

  .page-header{padding:3.5rem 6vw 2.5rem;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:2rem;border-bottom:1px solid #eee;}
  .page-header .mono{margin-bottom:.9rem;display:block;color:#999;}
  .page-header h1{font-size:clamp(2.4rem,6vw,5rem);}
  .page-header p{margin-top:.8rem;font-size:.85rem;color:#777;}

  .filters{display:flex;gap:1.8rem;}
  .filter-btn{background:none;border:none;color:#999;font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:0 0 .3rem;cursor:pointer;border-bottom:1px solid transparent;transition:color .15s,border-color .15s;}
  .filter-btn:hover{color:#333;}
  .filter-btn.active{color:var(--k);border-color:var(--k);}

  /* MASONRY */
  .gallery{padding:3.5rem 6vw 6rem;column-count:1;column-gap:1.6rem;}
  @media(min-width:640px){ .gallery{column-count:2;} }
  @media(min-width:980px){ .gallery{column-count:3;} }
  @media(min-width:1400px){ .gallery{column-count:4;} }

  .g-item{break-inside:avoid;margin-bottom:1.6rem;cursor:zoom-in;position:relative;}
  .g-item img{display:block;width:100%;height:auto;filter:grayscale(100%) contrast(1.02);transition:filter .3s ease;}
  .g-item:hover img{filter:grayscale(0%) contrast(1.02);}
  .g-item .g-idx{position:absolute;top:.7rem;left:.7rem;font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.08em;color:#fff;background:rgba(0,0,0,.55);padding:.2rem .5rem;opacity:0;transition:opacity .2s;}
  .g-item:hover .g-idx{opacity:1;}

  .gallery.transitioning .g-item{opacity:0;transform:translateY(6px);}
  .g-item{opacity:1;transform:translateY(0);transition:opacity .35s ease,transform .35s ease;}

  #lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.97);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:1.3rem;cursor:zoom-out;padding:2rem;}
  #lightbox.active{display:flex;}
  #lightbox img{max-width:85vw;max-height:80vh;object-fit:contain;}
  #lightbox-caption{font-family:'IBM Plex Mono',monospace;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:#888;}
  #lightbox-close{position:fixed;top:1.6rem;right:2rem;background:none;border:none;color:#aaa;font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;}
  #lightbox-close:hover{color:var(--w);}
  .lb-arrow{position:fixed;top:50%;transform:translateY(-50%);background:none;border:none;color:#aaa;font-family:'IBM Plex Mono',monospace;font-size:1.4rem;padding:1rem;cursor:pointer;transition:color .15s;}
  .lb-arrow:hover{color:var(--w);}
  .lb-arrow.prev{left:1rem;} .lb-arrow.next{right:1rem;}

  footer{padding:2rem 6vw 3rem;border-top:1px solid #eee;font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:#999;display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem;}
</style>
<script>
(function(){var c=document.createElement('canvas');c.width=c.height=32;var x=c.getContext('2d');
x.fillStyle='#000';x.fillRect(0,0,32,32);x.fillStyle='#fff';x.font='bold 15px monospace';x.textAlign='center';x.textBaseline='middle';x.fillText('AR',16,17);
var l=document.createElement('link');l.rel='icon';l.href=c.toDataURL();document.head.appendChild(l);})();
</script>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">Artur Rekstad</a>
  <ul>
    <li><a href="index.html#about">About</a></li>
    <li><a href="index.html#projects">Projects</a></li>
    <li><a href="index.html#cv">CV</a></li>
    <li><a href="index.html#contact">Contact</a></li>
  </ul>
</nav>

<div class="page-header">
  <div>
    <span class="mono">Archive — Visual Work</span>
    <h1 class="display">Photo &amp; Design</h1>
    <p>Photography · Graphic design · Art direction</p>
  </div>
  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('alla', this)">All</button>
    <button class="filter-btn" onclick="setFilter('foto', this)">Photo</button>
    <button class="filter-btn" onclick="setFilter('grafisk', this)">Graphic Design</button>
  </div>
</div>

<div class="gallery" id="gallery"></div>

<footer>
  <div id="gallery-count">21 works</div>
  <div><a href="index.html" style="color:inherit;text-decoration:none;">← Back to portfolio</a></div>
</footer>

<div id="lightbox" onclick="closeLightbox(event)">
  <button id="lightbox-close" onclick="closeLightbox()">✕ close</button>
  <button class="lb-arrow prev" onclick="event.stopPropagation(); shiftLight(-1)">←</button>
  <img id="lightbox-img" src="" alt="" />
  <div id="lightbox-caption"></div>
  <button class="lb-arrow next" onclick="event.stopPropagation(); shiftLight(1)">→</button>
</div>

<script>
  const images = [
    { src: 'images/grafisk_design/1.jpg',  category: 'grafisk' },
    { src: 'images/photos/photo1.jpg',     category: 'foto'    },
    { src: 'images/grafisk_design/2.jpg',  category: 'grafisk' },
    { src: 'images/photos/photo2.jpg',     category: 'foto'    },
    { src: 'images/grafisk_design/3.jpg',  category: 'grafisk' },
    { src: 'images/photos/photo3.jpg',     category: 'foto'    },
    { src: 'images/grafisk_design/4.png',  category: 'grafisk' },
    { src: 'images/photos/photo4.jpg',     category: 'foto'    },
    { src: 'images/grafisk_design/5.jpg',  category: 'grafisk' },
    { src: 'images/photos/photo5.jpg',     category: 'foto'    },
    { src: 'images/grafisk_design/6.jpg',  category: 'grafisk' },
    { src: 'images/photos/photo6.jpg',     category: 'foto'    },
    { src: 'images/grafisk_design/1.png',  category: 'grafisk' },
    { src: 'images/photos/photo7.jpg',     category: 'foto'    },
    { src: 'images/grafisk_design/2.png',  category: 'grafisk' },
    { src: 'images/photos/photo8.jpg',     category: 'foto'    },
    { src: 'images/grafisk_design/3.png',  category: 'grafisk' },
    { src: 'images/photos/photo9.jpg',     category: 'foto'    },
    { src: 'images/photos/photo10.jpg',    category: 'foto'    },
    { src: 'images/photos/photo11.jpg',    category: 'foto'    },
    { src: 'images/grafisk_design/7.jpg',  category: 'grafisk' },
  ];

  const gallery = document.getElementById('gallery');
  const countEl = document.getElementById('gallery-count');
  let currentFilter = 'alla';
  let currentLight  = 0;
  let visibleImages = [];

  function render() {
    visibleImages = images.filter(img => currentFilter === 'alla' || img.category === currentFilter);
    gallery.innerHTML = '';
    visibleImages.forEach((img, i) => {
      const tag = img.category === 'grafisk' ? 'GD.' + String(i+1).padStart(2,'0') : 'PH.' + String(i+1).padStart(2,'0');
      const item = document.createElement('div');
      item.className = 'g-item';
      item.innerHTML = `<span class="g-idx">${tag}</span><img src="${img.src}" alt="" loading="lazy" />`;
      item.addEventListener('click', () => openLightbox(i));
      gallery.appendChild(item);
    });
    countEl.textContent = visibleImages.length + ' works';
  }

  function setFilter(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    gallery.style.opacity = '0';
    setTimeout(() => { render(); gallery.style.opacity = '1'; }, 150);
  }
  gallery.style.transition = 'opacity .15s ease';

  function openLightbox(index) {
    currentLight = index;
    updateLightbox();
    document.getElementById('lightbox').classList.add('active');
    document.body.style.overflow = 'hidden';
  }
  function updateLightbox() {
    const img = visibleImages[currentLight];
    document.getElementById('lightbox-img').src = img.src;
    document.getElementById('lightbox-caption').textContent = (currentLight + 1) + ' / ' + visibleImages.length;
  }
  function shiftLight(dir) {
    currentLight = (currentLight + dir + visibleImages.length) % visibleImages.length;
    updateLightbox();
  }
  function closeLightbox(e) {
    if (e && e.target !== document.getElementById('lightbox') && e.target !== document.getElementById('lightbox-close')) return;
    document.getElementById('lightbox').classList.remove('active');
    document.body.style.overflow = '';
  }
  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('active')) return;
    if (e.key === 'ArrowRight') shiftLight(1);
    if (e.key === 'ArrowLeft')  shiftLight(-1);
    if (e.key === 'Escape')     closeLightbox();
  });

  render();
</script>
</body>
</html>
